groups:
  - name: getnet
    rules:
      - alert: GetnetHighErrorRate
        expr: |
          sum(rate(getnet_http_responses_total{code=~"5.."}[5m]))
            / sum(rate(getnet_http_responses_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "5xx responses above 5% of traffic over 5 minutes"

      - alert: GetnetHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(getnet_request_latency_seconds_bucket[5m]))) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 request latency above 20 s for 10 minutes"

      - alert: GetnetHighCostPerHour
        expr: |
          sum(increase(getnet_llm_cost_usd_total[1h])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM cost above US$ 1 in the last hour"

      - alert: GetnetTicketWaiting
        expr: |
          getnet_ticket_oldest_age_seconds > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Oldest open ticket waiting more than 30 minutes"
